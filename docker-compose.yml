version: '3.8'

services:
  notification-service:
    build: ./notification-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082

  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:8082
    depends_on:
      - notification-service